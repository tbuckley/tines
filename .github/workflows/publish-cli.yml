name: Publish CLI

# Every merge to main publishes a new `tines` to npm, so the CLI agents install
# can never drift behind the API it talks to (Tines/42: the published 0.0.1
# predated `issues artifacts`, and every stage's instructions were unrunnable
# as written because of it).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes are strictly ordered and never cancelled: npm versions are
# immutable, so a cancelled-mid-publish run is worse than a queued one.
concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Auth is OIDC trusted publishing — no stored npm token anywhere. npmjs
      # trusts this exact repository + workflow filename (configured under the
      # package's Settings on npmjs.com; see "Publishing the CLI to npm" in the
      # README), and pnpm exchanges the GitHub-minted id-token for a short-lived
      # publish credential. Requires a GitHub-hosted runner.
      id-token: write
    steps:
      # Full history: the patch number is the commit count (see below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Version scheme: <major>.<minor> comes from packages/cli/package.json and
      # is bumped by hand when you want a new line; the patch is the commit
      # count on main. That is monotonic, unique per merge, and — crucially —
      # needs no bump commit pushed back to main, which the "main-protect"
      # ruleset forbids (PR-only, no bypass actors). The manifest in the repo
      # therefore stays at its <major>.<minor>.x base and does NOT match what is
      # on npm; `tines --version` reads the manifest at runtime, so the
      # published binary still reports its real version.
      - name: Compute the version to publish
        id: version
        run: |
          set -euo pipefail
          base=$(node -p "require('./packages/cli/package.json').version")
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "packages/cli/package.json version '$base' is not plain major.minor.patch" >&2
            exit 1
          fi
          version="${base%.*}.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Re-runs, and pushes that land while an earlier publish is queued,
          # must not fail the workflow on npm's "cannot publish over an
          # existing version".
          if npm view "tines@$version" version >/dev/null 2>&1; then
            echo "tines@$version is already on npm — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version into the manifest
        if: steps.version.outputs.skip == 'false'
        run: npm pkg set "version=${{ steps.version.outputs.version }}" --prefix packages/cli

      - run: pnpm build
        if: steps.version.outputs.skip == 'false'

      - run: pnpm test
        if: steps.version.outputs.skip == 'false'

      # No explicit auth step: with no token in the environment, pnpm publish
      # detects the Actions OIDC context and does the trusted-publishing
      # exchange itself. If this fails with a 401/403/404, the trusted
      # publisher on npmjs doesn't match this repo + workflow filename yet —
      # see the README's one-time setup.
      # --no-git-checks: the manifest is intentionally dirty from the version
      # stamp above. No --provenance: attestations require a public source
      # repository, and tbuckley/tines is private.
      - name: Publish to npm
        if: steps.version.outputs.skip == 'false'
        working-directory: packages/cli
        run: pnpm publish --no-git-checks --access public

      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.skip }}" = "true" ]; then
            echo "Skipped: tines@${{ steps.version.outputs.version }} already published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published \`tines@${{ steps.version.outputs.version }}\` — \`npm i -g tines@latest\`." >> "$GITHUB_STEP_SUMMARY"
          fi
