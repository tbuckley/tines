name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in commit order. Don't cancel a running deploy —
# a half-applied migration + deploy pair is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve deployment identity
        id: identity
        run: |
          echo "version=$(node scripts/release-version.mjs)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: pnpm build
        env:
          TINES_BUILD_CHANNEL: production
          TINES_BUILD_VERSION: ${{ steps.identity.outputs.version }}
          TINES_BUILD_COMMIT: ${{ steps.identity.outputs.commit }}

      - run: pnpm test

      # Migrations run before the new worker code goes live, so keep them
      # backwards-compatible with the currently deployed version (additive
      # changes; use expand/contract for renames and drops).
      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply tines --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
