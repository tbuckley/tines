<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- maximum-scale=1 stops iOS Safari's automatic zoom when focusing form fields;
		     since iOS 10 it does not block user pinch-zoom, so accessibility is preserved. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
